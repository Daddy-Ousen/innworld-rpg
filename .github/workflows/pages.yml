# Publish the browser build to GitHub Pages (ADR 0031).
# It does not build the game: tools/release.ps1 builds InnworldRPG-v<version>-web.zip locally, and the zip is
# uploaded to the GitHub release. This workflow takes that zip from the release and publishes it.
name: Web build to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag with a *-web.zip file (empty = the newest release)
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/site
      - name: Get the web zip from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "Release: $TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-web.zip' --output web.zip
          mkdir site
          unzip -q web.zip -d site
          test -f site/index.html
          # Static pages (terms, privacy) live in docs/site and ship next to the game.
          cp docs/site/* site/
          # Link box on the game page: themed like the game, bottom right, on top of the canvas.
          cat > link.html <<'EOT'
<style>@font-face{font-family:"Pixel Operator";src:url(PixelOperator.ttf)}
#legal{position:fixed;right:10px;bottom:10px;z-index:9;font:18px "Pixel Operator",monospace;background:#301f12;border:3px solid #d9a655;padding:3px 10px}
#legal a{color:#ffd166;text-decoration:none}#legal a:hover{color:#fff}</style>
<div id="legal"><a href="terms.html">Terms</a> &middot; <a href="privacy.html">Privacy</a></div>
EOT
          sed -i '/<\/body>/e cat link.html' site/index.html
          grep -q 'id="legal"' site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
